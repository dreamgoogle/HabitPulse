<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>HabitPulse — Admin</title>
  <style>
    :root {
      --bg: #0b1120; --card: #141c2f; --border: #233049;
      --text: #e8edf7; --sub: #93a3bd; --brand: #6366f1;
      --ok: #10b981; --warn: #f59e0b; --bad: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh; padding: 28px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 1020px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 21px; font-weight: 800; }
    .muted { color: var(--sub); font-size: 13px; }
    button {
      padding: 9px 16px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 26px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .kpi-val { font-size: 29px; font-weight: 800; }
    .kpi-lbl { font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    th, td { padding: 11px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
    th { background: rgba(99,102,241,.1); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--sub); }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .badge.admin { background: rgba(245,158,11,.16); color: var(--warn); }
    .badge.user { background: rgba(148,163,184,.14); color: var(--sub); }
    .gate { display: grid; place-items: center; min-height: 70vh; text-align: center; }
    .gate p { color: var(--sub); font-size: 14px; margin: 10px 0 18px; max-width: 360px; }
    .hidden { display: none !important; }
    #error { background: rgba(244,63,94,.12); border: 1px solid var(--bad); color: var(--bad);
             padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Gate -->
    <div id="gate" class="gate">
      <div>
        <h1>⚡ HabitPulse Admin</h1>
        <p id="gate-msg">Admin account se sign in kijiye.</p>
        <button id="gate-btn" class="primary">Sign in with Google</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dash" class="hidden">
      <header>
        <div>
          <h1>⚡ HabitPulse Admin</h1>
          <div class="muted" id="who"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="refresh">↻ Refresh</button>
          <button id="signout">Sign out</button>
        </div>
      </header>

      <div id="error" class="hidden"></div>

      <div class="kpis">
        <div class="kpi"><div class="kpi-val" id="k-total">—</div><div class="kpi-lbl">Total Users</div></div>
        <div class="kpi"><div class="kpi-val" id="k-dau" style="color:var(--ok)">—</div><div class="kpi-lbl">Active (24h)</div></div>
        <div class="kpi"><div class="kpi-val" id="k-wau" style="color:var(--brand)">—</div><div class="kpi-lbl">Active (7d)</div></div>
        <div class="kpi"><div class="kpi-val" id="k-new" style="color:var(--warn)">—</div><div class="kpi-lbl">New Today</div></div>
      </div>

      <h2 style="font-size:15px; font-weight:700; margin-bottom:12px;">Recent Users</h2>
      <table>
        <thead>
          <tr><th>User</th><th>Email</th><th>Role</th><th>Joined</th><th>Last Seen</th></tr>
        </thead>
        <tbody id="users"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
      <div style="margin-top:14px;">
        <button id="more" class="hidden">Load more</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
