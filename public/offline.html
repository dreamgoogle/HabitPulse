<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>HabitPulse — Offline</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #090d16; color: #f8fafc; text-align: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .logo { font-size: 56px; margin-bottom: 14px; }
    h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; max-width: 320px; margin: 0 auto 20px; }
    button {
      padding: 12px 24px; border: none; border-radius: 12px;
      background: #4f46e5; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    @media (prefers-color-scheme: light) {
      body { background: #e2e8f0; color: #0f172a; }
      p { color: #475569; }
    }
  </style>
</head>
<body>
  <div>
    <div class="logo">⚡</div>
    <h1>Abhi offline hain</h1>
    <p>
      Internet connection nahi mil raha. Aapka maujooda data device par surakshit hai
      aur connection wapas aate hi sync ho jayega.
    </p>
    <button onclick="location.reload()">Dobara koshish karein</button>
  </div>
</body>
</html>
